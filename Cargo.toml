[package]
name = "waysaver"
version = "1.0.0-beta.1"
edition = "2024"
description = "A minimal Wayland screensaver: black screen or any program as a theme, respecting inhibitors"
license = "GPL-3.0-or-later"
repository = "https://github.com/pixmatic/waysaver"
readme = "README.md"
keywords = ["wayland", "screensaver", "idle", "layer-shell"]
categories = ["command-line-utilities"]

[dependencies]
dbus = { version = "0.9.12", default-features = false }
rustix = { version = "1.1.6", default-features = false, features = ["event", "fs"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

# Optional modules. The default build is the minimal one; every feature is
# independent and any combination must build (see scripts/check.sh).
[features]
default = []
# One overlay per monitor, following hotplug (default: a single overlay on
# the monitor the compositor picks).
multimonitor = []
# --ignore-mouse: pointer motion doesn't unblank; keys, buttons, scroll and
# touch still do.
ignore-mouse = []
# <theme...> argument: run an external program (video, shader, browser...)
# while idle; `blank` keeps the black screen.
theme = ["rustix/process", "rustix/std"]

# Small release binaries: about half the size, at the cost of a slower build.
[profile.release]
strip = true
lto = true
codegen-units = 1
