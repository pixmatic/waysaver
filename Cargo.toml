[package]
name = "wayvoid"
version = "0.1.0"
edition = "2024"

[dependencies]
dbus = { version = "0.9.12", default-features = false }
rustix = { version = "1.1.6", default-features = false, features = ["event", "fs"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

# Optional modules. The default build is the minimal one; every feature is
# independent and any combination must build (see scripts/check.sh).
[features]
default = []
